[project]
name = "llm-project"
version = "0.1.0"
description = "LLM project for course 1RT730"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "langgraph>=1,<2",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "pypdf>=4,<5",
    "sentence-transformers>=3,<4",
    "faiss-cpu>=1.7,<2",
    "numpy>=1.25,<3",
]

[project.optional-dependencies]
ui = ["gradio>=4.44.1,<6"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
claim-demo = "app.demo:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["model_download: requires a real embedding model (may download weights)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
